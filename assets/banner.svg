<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".3" stroke-width=".5" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes pulse{0%{transform:scale(1);opacity:.8}}.pulse-line{stroke-dasharray:8 12;animation:dash 20s linear infinite}.glow-text{text-shadow:0 0 20px rgba(168,85,247,.5)}</style></defs><rect width="1200" height="360" fill="url(#bgGradient)" rx="16"/><rect width="1200" height="360" fill="url(#grid)" rx="16"/><g fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity=".35"><path stroke-width="3" d="M 100 280 C 300 340, 500 220, 700 290 S 1000 330, 1100 250" class="pulse-line"/><path stroke-width="2" d="M 50 100 C 250 40, 450 140, 750 60 S 1050 40, 1150 120" class="pulse-line"/></g><g opacity=".25"><rect width="120" height="36" x="80" y="240" fill="#6366f1" rx="18"/><text x="140" y="263" fill="#fff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">SDK Sources</text><rect width="130" height="36" x="420" y="270" fill="#a855f7" rx="18"/><text x="485" y="293" fill="#fff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Data Warehouse</text><rect width="130" height="36" x="820" y="250" fill="#ec4899" rx="1